  <title>Transient Shaper MB</title>
  <!--
    No <style> block and no external stylesheet link here by design.
    Global CSS lives in src/styles/tokens.css so it can use custom properties.

    Do NOT add a Google Fonts <link>: vite.config.js sets COEP require-corp for
    SharedArrayBuffer, which silently blocks cross-origin subresources. The
    waveforms would fall back to synthetic data with no visible error. If a real
    Inter webfont is wanted, self-host it under public/fonts/ and @font-face it
    from tokens.css.
  -->
</head>
